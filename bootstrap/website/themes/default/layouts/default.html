<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta ht-include='fragments/head' />

        <!-- Layout Metadata -->
        <meta name='layout:name' content='default' />

        <!-- Layout Components -->
        <script src='/js/components/example-component.js' defer></script>

        <!-- Layout Styles -->
        <style id='components' ht-pipe='from "style.component" as css'></style>
        <style id='layout'>
            :is(h2,h3,h4,h5,h6):not(:last-child) {
                margin-bottom: var(--gutter-1x, 15px);
            }
        </style>
    </head>
    <body>
        <header ht-include='fragments/header'></header>
        <main>
            <section>
                <content-container ht-apply>
                    <h2 ht-apply ht-if='${ page.title }'>
                        ${ page.title, "Welcome to HyperTemplates" }
                    </h2>
                    ${ markdown(page.content) }
                    <example-component>
                        <!-- this is an example web component -->
                    </example-component>
                </content-container>
            </section>
        </main>
        <content-whitespace></content-whitespace>
        <footer ht-include='fragments/footer'></footer>
    </body>
</html>
