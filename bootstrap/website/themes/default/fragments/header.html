<header>
    <style class='component'>
        header { background-color: rgba(246,237,228); }
        header content-row { align-items: center; }
        header nav a { margin-left: var(--gutter-1x); }
    </style>
    <content-container>
        <content-row flex spread>
            <h1 ht-apply>${ site.title, "Welcome to HyperTexting" }</h1>
            <nav>
                <menu>
                    <a ht-each='link in ${ data.nav.main }' href='${ link.href, "#" }'>
                        ${ link.title, link.label, link.name, link.text, "" }
                    </a>
                </menu>
            </nav>
        </content-row>
    </content-container>
</header>
