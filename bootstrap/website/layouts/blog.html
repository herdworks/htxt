<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta ht-include='fragments/head' />

        <!-- Layout Metadata -->
        <meta name='layout:name' content='default' />

        <!-- Layout Components -->
        <script src='/js/components/example-component.js' defer></script>
        <script src='/js/components/relative-time.js' defer></script>

        <!-- Layout Styles -->
        <style id='layout'>
            blog-post {
                display: block;
                width: 100%;
                margin-bottom: var(--gutter-3x, 45px);
            }
            blog-post content-row { margin-bottom: var(--gutter-1x, 15px); }
        </style>
    </head>
    <body>
        <header ht-include='fragments/header'></header>
        <main>
            <section>
                <content-container>
                    <blog-post ht-each='post in ${ page.feed.pages }' ht-base='src on ${ post.path }' ht-base='href on ${ post.path }'>
                        <content-row flex spread>
                            <a ht-apply href='${ post.path }'>
                                <h3 ht-apply>
                                    ${ post.title, "" }
                                </h3>
                            </a>
                            <relative-time>
                                <time ht-apply datetime='${ post.updated_at, post.created_at }'>
                                    ${ post.updated_at, post.created_at, "" }
                                </time>
                            </relative-time>
                        </content-row>
                        ${ markdown(post.summary, post.content) }
                        <continue-reading ht-if='${ post.more }'>
                            <a ht-apply href='${ post.path, "#" }'>Continue Reading →</a>
                        </continue-reading>
                    </blog-post>
                </content-container>
            </section>
        </main>
        <content-whitespace></content-whitespace>
        <footer ht-include='fragments/footer'></footer>
    </body>
</html>
