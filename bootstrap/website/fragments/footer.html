<footer>
    <style ht-pipe='to "style#components" as css'>
        footer { --icon-size: 36px; }
        footer { background-color: rgba(0,0,0,1.0); }
        footer { color: rgba(255,255,255,0.75); }
        footer content-row[grid] { grid-template-columns: 1fr var(--icon-size) 1fr; }
        footer svg { height: var(--icon-size); aspect-ratio: 1; }
    </style>
    <content-container>
        <nav>
            <menu>
                <a ht-each='link in ${ data.nav.links }' ht-if='${ data.nav }' href='${ link.href, "#" }'>
                    ${ link.title, link.label, link.name, link.text, "" }
                </a>
            </menu>
        </nav>
        <content-row grid spread>
            <span>
                &copy; 2025
                <a ht-apply href='${ site.byline.href, "/" }' target='_blank'>${ site.byline.name, site.byline.username, "Placeholder" }</a>
            </span>

            <a href='/blog/atom.xml'>
                <svg ht-include='fragments/icons/feed.svg'></svg>
            </a>

            <span>
                Made with ❤️ using <a href='https://preview.hypertemplates.net/'>HyperTemplates</a>
            </span>
        </content-row>
    </content-container>
</footer>
